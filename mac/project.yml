# XcodeGen spec: `brew install xcodegen && xcodegen` in this folder creates EcoFlowTray.xcodeproj.
# Change BUNDLE_PREFIX below to something unique to you (e.g. com.yourname) — Apple requires unique bundle IDs.

name: EcoFlowTray
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    BUNDLE_PREFIX: com.mitbor
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  EcoFlowTray:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EcoFlow Tray
        LSUIElement: true                 # menu bar only, no Dock icon
        LSApplicationCategoryType: public.app-category.utilities
        EcoFlowAppGroup: $(TeamIdentifierPrefix)ecoflowtray.shared
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)ecoflowtray.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).ecoflowtray
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: EcoFlowWidget

  EcoFlowWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: EcoFlow Widget
        EcoFlowAppGroup: $(TeamIdentifierPrefix)ecoflowtray.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)ecoflowtray.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).ecoflowtray.widget
        GENERATE_INFOPLIST_FILE: NO
